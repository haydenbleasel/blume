version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "monthly"
    labels: ["dependencies", "github_actions"]

  # Maintain dependencies for Bun (the npm ecosystem can't update bun.lock)
  - package-ecosystem: "bun"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "monthly"
    labels: ["dependencies", "javascript"]
    ignore:
      # TypeScript 7 has no JS API, which Blume's tooling depends on.
      - dependency-name: "typescript"
        versions: [">= 7"]
      # @types/node tracks Blume's Node floor (engines.node >=22.19.0), so the
      # types never offer an API the oldest supported Node lacks. Raise this
      # with the floor.
      - dependency-name: "@types/node"
        versions: [">= 23"]
      # Move together, by hand, once @astrojs/react's oxc-transform-react peer
      # accepts the newer oxc: plugin-react is pinned so npm can't hoist a copy
      # whose oxc peer disagrees with @astrojs/react's (see astro-peers.test.ts).
      - dependency-name: "@vitejs/plugin-react"
      - dependency-name: "oxc-transform-react"
