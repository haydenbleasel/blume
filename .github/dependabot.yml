version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "monthly"
    labels: ["dependencies", "github_actions"]

  # Maintain dependencies for Bun (the npm ecosystem can't update bun.lock)
  - package-ecosystem: "bun"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "monthly"
    labels: ["dependencies", "javascript"]
    ignore:
      # TypeScript 7 has no JS API, which Blume's tooling depends on.
      - dependency-name: "typescript"
        versions: [">= 7"]
