name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# id-token: write enables npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.
permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}

    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"

    steps:
      # changesets/action pushes through the GitHub API with its own
      # `github-token`, so git never needs the token checkout would persist.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare repository
        run: git fetch --unshallow --tags

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # OIDC publishing needs npm 11.5.1 or later. Pinned so a new npm release
      # never runs with publish rights before it has been reviewed.
      - name: Update npm
        run: npm install -g npm@12.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        name: Install Bun

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Setup Bun cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      # v2 renamed the inputs, authenticates through the `github-token` input
      # (defaulting to the workflow token) instead of the GITHUB_TOKEN env var,
      # and no longer writes an .npmrc from NPM_TOKEN — publishing stays on
      # Trusted Publishing via the id-token permission above.
      - name: Create Release PR or Publish to NPM
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run changeset version
          publish-script: npm run changeset publish

  # Redeploy the docs site once a release is out so the changelog (built from
  # GitHub releases) includes it. This is the only automatic deploy; plain pushes
  # to main do not ship the site.
  deploy:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
