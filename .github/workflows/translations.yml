name: Translations

on:
  pull_request:

permissions:
  contents: read

jobs:
  translations:
    runs-on: ubuntu-latest
    # Only the changesets release PR carries pending translation updates;
    # regular PRs haven't been translated yet, so checking them is noise.
    # (pull_request branch filters only match the base branch, hence the job-level if.)
    if: github.head_ref == 'changeset-release/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Check translations
        run: cd apps/docs && bun run translate --check
