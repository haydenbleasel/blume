name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Build caches a fresh runner would otherwise rebuild from scratch:
      # Astro's build-mode cache (the content store, digest-keyed so unchanged
      # pages skip re-syncing, and the downloaded Google font files, which
      # also sidesteps the gstatic 404s the build step retries around) and
      # the rendered OG cards, keyed by content (packages/blume/src/og/cache.ts)
      # so only the cards whose page title or description changed render
      # again. The key is unique per run so every run saves its current set;
      # restoring the newest entry is safe because everything in it is
      # validated by digest before reuse.
      - uses: actions/cache@v6
        name: Restore build caches
        with:
          path: |
            apps/docs/.blume/.cache/astro
            apps/docs/node_modules/.cache/blume/og
          key: ${{ runner.os }}-blume-build-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-blume-build-cache-

      - name: Build docs
        # Google's CSS API occasionally references gstatic font files that
        # 404 mid-rollout, failing the build with CannotFetchFontFile. Retry
        # that specific transient failure (clearing the build-mode font cache,
        # under Astro's cacheDir, so a stale URL list isn't replayed); any
        # other failure surfaces immediately.
        run: |
          cd apps/docs
          for attempt in 1 2 3; do
            bun run build 2>&1 | tee build.log && exit 0
            grep -q "CannotFetchFontFile" build.log || exit 1
            echo "Font CDN 404 on attempt ${attempt}; clearing font cache and retrying"
            rm -rf .blume/.cache/astro/fonts
            sleep 15
          done
          exit 1

  # Same build on Windows, so a path, symlink or shell assumption that only
  # holds on POSIX shows up here instead of in a user's terminal. The retry
  # step runs under Git Bash (`shell: bash`), which windows-latest ships,
  # so it can stay byte-for-byte the same as the Linux one above.
  build-docs-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        name: Restore build caches
        with:
          path: |
            apps/docs/.blume/.cache/astro
            apps/docs/node_modules/.cache/blume/og
          key: ${{ runner.os }}-blume-build-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-blume-build-cache-

      - name: Build docs
        shell: bash
        run: |
          cd apps/docs
          for attempt in 1 2 3; do
            bun run build 2>&1 | tee build.log && exit 0
            grep -q "CannotFetchFontFile" build.log || exit 1
            echo "Font CDN 404 on attempt ${attempt}; clearing font cache and retrying"
            rm -rf .blume/.cache/astro/fonts
            sleep 15
          done
          exit 1

      - name: Diagnose (temporary)
        if: failure()
        shell: bash
        run: |
          set +e
          cd apps/docs
          echo "== .blume"; ls -la .blume | head -30
          echo "== .blume/node_modules/@astrojs"; ls -la .blume/node_modules/@astrojs 2>&1 | head
          echo "== pkg jsons"; ls .blume/node_modules/astro/package.json .blume/node_modules/@astrojs/mdx/package.json 2>&1
          echo "== blume deps"; ls -la ../../packages/blume/node_modules/astro ../../packages/blume/node_modules/@astrojs/mdx 2>&1 | head
          echo "== root astro"; ls -la ../../node_modules/astro 2>&1 | head -3
          echo "== config head"; head -20 .blume/astro.config.mjs
          echo "== node resolve from .blume"
          (cd .blume && node --input-type=module -e "console.log(import.meta.resolve('@astrojs/mdx')); console.log(import.meta.resolve('astro'))" 2>&1)
          echo "== resolver internals"
          cat > diag.ts <<'TS'
          import { lstatSync, readlinkSync, realpathSync } from "node:fs";
          import { blumeDepsDir, ensureDepsLink } from "../../packages/blume/src/astro/generate.ts";
          import { packageRoot } from "../../packages/blume/src/core/package-root.ts";
          console.log("packageRoot", packageRoot());
          console.log("blumeDepsDir", blumeDepsDir());
          const link = `${process.cwd()}/.blume/node_modules`;
          try { const s = lstatSync(link); console.log("link isSymbolicLink", s.isSymbolicLink(), "readlink", readlinkSync(link), "realpath", realpathSync(link)); } catch (e) { console.log("link lstat failed", String(e)); }
          console.log("ensureDepsLink", await ensureDepsLink(`${process.cwd()}/.blume`));
          try { const s = lstatSync(link); console.log("after: isSymbolicLink", s.isSymbolicLink(), "readlink", readlinkSync(link), "realpath", realpathSync(link)); } catch (e) { console.log("after: lstat failed", String(e)); }
          TS
          bun diag.ts
