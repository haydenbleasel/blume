name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Build caches a fresh runner would otherwise rebuild from scratch:
      # Astro's build-mode cache (the content store, digest-keyed so unchanged
      # pages skip re-syncing, and the downloaded Google font files, which
      # also sidesteps the gstatic 404s the build step retries around) and
      # the rendered OG cards, keyed by content (packages/blume/src/og/cache.ts)
      # so only the cards whose page title or description changed render
      # again. The key is unique per run so every run saves its current set;
      # restoring the newest entry is safe because everything in it is
      # validated by digest before reuse.
      - uses: actions/cache@v6
        name: Restore build caches
        with:
          path: |
            apps/docs/.blume/.cache/astro
            apps/docs/node_modules/.cache/blume/og
          key: ${{ runner.os }}-blume-build-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-blume-build-cache-

      - name: Build docs
        # Google's CSS API occasionally references gstatic font files that
        # 404 mid-rollout, failing the build with CannotFetchFontFile. Retry
        # that specific transient failure (clearing the build-mode font cache,
        # under Astro's cacheDir, so a stale URL list isn't replayed); any
        # other failure surfaces immediately.
        run: |
          cd apps/docs
          for attempt in 1 2 3; do
            bun run build 2>&1 | tee build.log && exit 0
            grep -q "CannotFetchFontFile" build.log || exit 1
            echo "Font CDN 404 on attempt ${attempt}; clearing font cache and retrying"
            rm -rf .blume/.cache/astro/fonts
            sleep 15
          done
          exit 1

  # Same build on Windows, so a path, symlink or shell assumption that only
  # holds on POSIX shows up here instead of in a user's terminal. The retry
  # step runs under Git Bash (`shell: bash`), which windows-latest ships,
  # so it can stay byte-for-byte the same as the Linux one above.
  build-docs-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        name: Restore build caches
        with:
          path: |
            apps/docs/.blume/.cache/astro
            apps/docs/node_modules/.cache/blume/og
          key: ${{ runner.os }}-blume-build-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-blume-build-cache-

      - name: Build docs
        shell: bash
        run: |
          cd apps/docs
          for attempt in 1 2 3; do
            bun run build 2>&1 | tee build.log && exit 0
            grep -q "CannotFetchFontFile" build.log || exit 1
            echo "Font CDN 404 on attempt ${attempt}; clearing font cache and retrying"
            rm -rf .blume/.cache/astro/fonts
            sleep 15
          done
          exit 1

      - name: Diagnose (temporary)
        if: failure()
        shell: bash
        run: |
          set +e
          cd apps/docs
          cat > diag.mjs <<'JS'
          import { statSync, lstatSync, readlinkSync, symlinkSync, realpathSync, mkdirSync, rmSync, readdirSync, writeFileSync } from "node:fs";
          import { execSync } from "node:child_process";
          import { resolve } from "node:path";
          import { pathToFileURL } from "node:url";
          const cwd = process.cwd();
          const repo = resolve(cwd, "../..");
          const deps = resolve(repo, "packages/blume/node_modules");
          const probe = (label, p) => {
            try { const s = statSync(p); console.log("OK ", label, "isDir", s.isDirectory()); }
            catch (e) { console.log("ERR", label, e.code); }
          };
          const sh = (cmd) => { try { console.log(execSync(cmd, { stdio: ["ignore", "pipe", "pipe"] }).toString()); } catch (e) { console.log("cmd failed", cmd, e.message); } };
          console.log("== link kinds");
          for (const p of [resolve(cwd, ".blume/node_modules"), resolve(deps, "astro"), resolve(deps, "@astrojs/mdx"), resolve(repo, "node_modules/astro"), resolve(cwd, "node_modules/blume")]) {
            try { const s = lstatSync(p); console.log(p, "symlink:", s.isSymbolicLink(), s.isSymbolicLink() ? "->" + readlinkSync(p) : ""); } catch (e) { console.log(p, "lstat ERR", e.code); }
          }
          sh(`cmd /c dir "${resolve(cwd, ".blume")}"`);
          sh(`cmd /c dir "${resolve(deps, "@astrojs")}"`);
          console.log("== stat probes");
          probe("junction dir itself", resolve(cwd, ".blume/node_modules"));
          probe("junction -> real subdir @astrojs", resolve(cwd, ".blume/node_modules/@astrojs"));
          probe("junction -> relsymlink astro", resolve(cwd, ".blume/node_modules/astro"));
          probe("junction -> relsymlink @astrojs/mdx", resolve(cwd, ".blume/node_modules/@astrojs/mdx"));
          probe("junction -> relsymlink @astrojs/mdx/package.json", resolve(cwd, ".blume/node_modules/@astrojs/mdx/package.json"));
          probe("direct relsymlink astro", resolve(deps, "astro"));
          probe("direct relsymlink @astrojs/mdx", resolve(deps, "@astrojs/mdx"));
          console.log("== candidate A: dir symlink instead of junction");
          const symDir = resolve(cwd, ".blume/nm-symlink");
          rmSync(symDir, { force: true, recursive: false });
          try { symlinkSync(deps, symDir, "dir"); probe("dirsymlink -> relsymlink @astrojs/mdx", resolve(symDir, "@astrojs/mdx")); } catch (e) { console.log("dir symlink create ERR", e.code, e.message); }
          console.log("== candidate B: per-package junctions to realpath");
          const nm2 = resolve(cwd, ".blume/nm2");
          rmSync(nm2, { force: true, recursive: true });
          let count = 0;
          for (const entry of readdirSync(deps)) {
            if (entry.startsWith(".")) continue;
            const src = resolve(deps, entry);
            if (entry.startsWith("@")) {
              mkdirSync(resolve(nm2, entry), { recursive: true });
              for (const sub of readdirSync(src)) {
                try { symlinkSync(realpathSync(resolve(src, sub)), resolve(nm2, entry, sub), "junction"); count++; } catch (e) { console.log("junction ERR", entry, sub, e.code); }
              }
            } else {
              mkdirSync(nm2, { recursive: true });
              try { symlinkSync(realpathSync(src), resolve(nm2, entry), "junction"); count++; } catch (e) { console.log("junction ERR", entry, e.code); }
            }
          }
          console.log("created", count, "package junctions");
          probe("pkg junction @astrojs/mdx/package.json", resolve(nm2, "@astrojs/mdx/package.json"));
          probe("pkg junction astro/package.json", resolve(nm2, "astro/package.json"));
          try { const m = await import(pathToFileURL(resolve(nm2, "@astrojs/mdx/dist/index.js")).href); console.log("OK  import mdx via pkg junction:", typeof m.default); } catch (e) { console.log("ERR import mdx via pkg junction:", e.message); }
          try { const m = await import(pathToFileURL(resolve(nm2, "astro/dist/core/config/index.js")).href); console.log("OK  import astro/config via pkg junction:", Object.keys(m).length, "exports"); } catch (e) { console.log("ERR import astro via pkg junction:", e.message); }
          console.log("== resolve from a file inside nm2");
          const probeDir = resolve(cwd, ".blume/probe");
          mkdirSync(probeDir, { recursive: true });
          rmSync(resolve(probeDir, "node_modules"), { force: true, recursive: true });
          symlinkSync(nm2, resolve(probeDir, "node_modules"), "junction");
          writeFileSync(resolve(probeDir, "x.mjs"), "import mdx from '@astrojs/mdx'; import { defineConfig } from 'astro/config'; console.log('OK  bare imports via junction->pkg-junctions', typeof mdx, typeof defineConfig);");
          try { await import(pathToFileURL(resolve(probeDir, "x.mjs")).href); } catch (e) { console.log("ERR bare imports via junction->pkg-junctions:", e.message); }
          rmSync(resolve(probeDir, "node_modules"), { force: true, recursive: true });
          mkdirSync(resolve(probeDir, "node_modules"), { recursive: true });
          for (const entry of readdirSync(nm2)) {
            const src = resolve(nm2, entry);
            if (entry.startsWith("@")) { mkdirSync(resolve(probeDir, "node_modules", entry), { recursive: true }); for (const sub of readdirSync(src)) symlinkSync(readlinkSync(resolve(src, sub)), resolve(probeDir, "node_modules", entry, sub), "junction"); }
            else symlinkSync(readlinkSync(src), resolve(probeDir, "node_modules", entry), "junction");
          }
          writeFileSync(resolve(probeDir, "y.mjs"), "import mdx from '@astrojs/mdx'; import { defineConfig } from 'astro/config'; console.log('OK  bare imports via real dir of pkg-junctions', typeof mdx, typeof defineConfig);");
          try { await import(pathToFileURL(resolve(probeDir, "y.mjs")).href); } catch (e) { console.log("ERR bare imports via real dir of pkg-junctions:", e.message); }
          JS
          node diag.mjs 2>&1
