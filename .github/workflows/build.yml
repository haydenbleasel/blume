name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Build caches a fresh runner would otherwise rebuild from scratch:
      # Astro's build-mode cache (the content store, digest-keyed so unchanged
      # pages skip re-syncing, and the downloaded Google font files, which
      # also sidesteps the gstatic 404s the build step retries around) and
      # the rendered OG cards, keyed by content (packages/blume/src/og/cache.ts)
      # so only the cards whose page title or description changed render
      # again. The key is unique per run so every run saves its current set;
      # restoring the newest entry is safe because everything in it is
      # validated by digest before reuse.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Restore build caches
        with:
          path: |
            apps/docs/.blume/.cache/astro
            apps/docs/node_modules/.cache/blume/og
          key: ${{ runner.os }}-blume-build-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-blume-build-cache-

      - name: Build docs
        # Google's CSS API occasionally references gstatic font files that
        # 404 mid-rollout, failing the build with CannotFetchFontFile. Retry
        # that specific transient failure (clearing the build-mode font cache,
        # under Astro's cacheDir, so a stale URL list isn't replayed); any
        # other failure surfaces immediately.
        run: |
          cd apps/docs
          for attempt in 1 2 3; do
            bun run build 2>&1 | tee build.log && exit 0
            grep -q "CannotFetchFontFile" build.log || exit 1
            echo "Font CDN 404 on attempt ${attempt}; clearing font cache and retrying"
            rm -rf .blume/.cache/astro/fonts
            sleep 15
          done
          exit 1

  # Same build on Windows, so a path, symlink or shell assumption that only
  # holds on POSIX shows up here instead of in a user's terminal. The retry
  # step runs under Git Bash (`shell: bash`), which windows-latest ships,
  # so it can stay byte-for-byte the same as the Linux one above.
  build-docs-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Restore build caches
        with:
          path: |
            apps/docs/.blume/.cache/astro
            apps/docs/node_modules/.cache/blume/og
          key: ${{ runner.os }}-blume-build-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-blume-build-cache-

      - name: Build docs
        shell: bash
        run: |
          cd apps/docs
          for attempt in 1 2 3; do
            bun run build 2>&1 | tee build.log && exit 0
            grep -q "CannotFetchFontFile" build.log || exit 1
            echo "Font CDN 404 on attempt ${attempt}; clearing font cache and retrying"
            rm -rf .blume/.cache/astro/fonts
            sleep 15
          done
          exit 1
