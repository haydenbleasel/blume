name: Deploy

# Builds the docs site (apps/docs, server output with the MCP server) and ships
# it to Cloudflare Workers. Runs from release.yml after a changesets publish so
# the site and changelog track the published package, and on demand. Plain
# pushes to main do not deploy.
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

# The token only reads GitHub releases for the changelog; deploying to
# Cloudflare uses CLOUDFLARE_API_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `lastModified` stamps come from git.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        name: Install Bun

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Setup Bun cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build caches a fresh runner would otherwise rebuild from scratch:
      # Astro's build-mode cache (the content store, digest-keyed so unchanged
      # pages skip re-syncing, and the downloaded Google font files, which
      # also sidesteps the gstatic 404s the build step retries around) and
      # the rendered OG cards, keyed by content (packages/blume/src/og/cache.ts)
      # so only the cards whose page title or description changed render
      # again. The key is unique per run so every run saves its current set;
      # restoring the newest entry is safe because everything in it is
      # validated by digest before reuse.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Restore build caches
        with:
          path: |
            apps/docs/.blume/.cache/astro
            apps/docs/node_modules/.cache/blume/og
          key: ${{ runner.os }}-blume-build-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-blume-build-cache-

      - name: Build docs
        env:
          # Changelog is built from GitHub releases; the token avoids rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx turbo run build --filter=docs

      - name: Deploy docs to Cloudflare Workers
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
